spring:
  application:
    name: ERP

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supermarket_erp_saas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      # Switched from 'update' to 'validate': ddl-auto=update was silently
      # re-narrowing event_publication columns back to varchar(255) on every
      # restart, based on Modulith's default JPA entity mapping. Flyway is
      # now the single source of truth for schema changes.
      ddl-auto: validate
    open-in-view: false   # never leave this true in a real app - hides N+1s

  modulith:
    events:
      jdbc:
        schema: platform
      # Spring Modulith's event publication registry = our outbox.
      # Failed/unprocessed events are persisted here and can be
      # externalized to Rabbit/Kafka later with almost no code change.
      jdbc-schema-initialization:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith

server:
  port: 8080

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads/products}
  security:
    # Replace this in every shared or production environment.
    # It must be at least 32 characters for HS256.
    jwt-secret: ${JWT_SECRET:local-only-change-this-jwt-secret-32-characters-minimum}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

logging:
  level:
    org.springframework.modulith: INFO