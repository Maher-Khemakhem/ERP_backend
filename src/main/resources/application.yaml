spring:
  application:
    name: ERP

  # Load the ignored local .env file when developing from the ERP directory.
  # Production deployments should inject these values through the environment
  # or a secret manager; the file remains optional.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supermarket_erp_saas_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      # Switched from 'update' to 'validate': ddl-auto=update was silently
      # re-narrowing event_publication columns back to varchar(255) on every
      # restart, based on Modulith's default JPA entity mapping. Flyway is
      # now the single source of truth for schema changes.
      ddl-auto: validate
    open-in-view: false   # never leave this true in a real app - hides N+1s

  modulith:
    events:
      jdbc:
        schema: platform
      # Spring Modulith's event publication registry = our outbox.
      # Failed/unprocessed events are persisted here and can be
      # externalized to Rabbit/Kafka later with almost no code change.
      jdbc-schema-initialization:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith

server:
  # Caddy is the public HTTPS boundary; do not expose Spring Boot directly.
  address: 127.0.0.1
  port: 8080

app:
  ecommerce:
    payment-timeout-minutes: ${ECOMMERCE_PAYMENT_TIMEOUT_MINUTES:15}
    expiry-scan-interval-ms: ${ECOMMERCE_EXPIRY_SCAN_INTERVAL_MS:60000}
  upload-dir: ${APP_UPLOAD_DIR:uploads/products}
  security:
    # Required. Never provide a default secret here.
    # Generate at least 32 random bytes and provide it through the environment.
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:supermarket-erp}
    jwt-audience: ${JWT_AUDIENCE:supermarket-web}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    login-rate-limit:
      # Per-instance login throttling. Use a shared edge limiter as well when
      # running more than one backend instance.
      ip-capacity: ${LOGIN_RATE_LIMIT_IP_CAPACITY:30}
      ip-window-seconds: ${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
      username-capacity: ${LOGIN_RATE_LIMIT_USERNAME_CAPACITY:10}
      username-window-seconds: ${LOGIN_RATE_LIMIT_USERNAME_WINDOW_SECONDS:60}
      max-buckets: ${LOGIN_RATE_LIMIT_MAX_BUCKETS:10000}

logging:
  level:
    org.springframework.modulith: INFO
