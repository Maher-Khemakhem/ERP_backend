name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit, integration, and module tests
        run: bash ./mvnw -B -ntp verify

      - name: Save tested backend package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
